stages:
  - build
  - test
  - deploy

build_job:
  stage: build
  script:
    - echo "Build stage"
    - echo "TEST" > test.txt
  artifacts:
    paths:
      - test.txt
    expire_in: 1 hour

test_job:
  stage: test
  script:
    - echo "Test stage"

deploy_job:
  stage: deploy
  script:
    - echo "Deploy stage"
